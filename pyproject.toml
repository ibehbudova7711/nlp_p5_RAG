[project]
name = "research-paper-rag"
version = "0.1.0"
description = "Local RAG system for research papers using Chroma, Ollama, and Streamlit"
requires-python = ">=3.10"

dependencies = [
    # Core
    "requests>=2.31.0",
    "pydantic>=2.0",

    # PDF processing
    "pypdf>=4.0.0",

    # Embeddings + tokenization
    "sentence-transformers>=2.6.0",

    # Vector DB
    "chromadb>=0.5.0",

    # Local LLM
    "ollama>=0.2.0",

    # UI
    "streamlit>=1.35.0",

    # API (optional but you already used it)
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",

    # Utilities
    "tqdm>=4.66.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"