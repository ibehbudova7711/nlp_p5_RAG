[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-paper-rag"
version = "0.1.0"
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.0",
    "pypdf>=4.0.0",
    "sentence-transformers>=2.6.0",
    "chromadb>=0.5.0",
    "ollama>=0.2.0",
    "streamlit>=1.35.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "tqdm>=4.66.0",
    "numpy>=1.26.0",
    "tabula-py>=2.9.0",
]

[tool.setuptools]
py-modules = ["collect_papers_to_chroma", "main"]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
]